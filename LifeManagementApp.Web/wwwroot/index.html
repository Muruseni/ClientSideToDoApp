<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Management</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><h1>Life Management</h1><p>A calm place for today’s priorities.</p></div>
      <nav><button data-view="home" class="nav-button active">Home</button><button data-view="tasks" class="nav-button">To-dos</button></nav>
    </header>

    <section id="home-view" class="view">
      <div class="grid two-column">
        <article class="card hero-card"><span class="eyebrow">Today</span><h2>Keep your important things moving.</h2><p id="home-summary">Loading your tasks…</p><button id="open-tasks" class="button">Open all to-dos</button></article>
        <article class="card weather-card"><div class="card-heading"><h2>Weather</h2><button id="weather-refresh" class="text-button">Refresh</button></div><div class="weather-search"><input id="city" value="Kyiv" placeholder="City"><button id="weather-load" class="button secondary">Get weather</button></div><div id="weather-result" class="weather-result">Choose a city to see the current weather.</div></article>
      </div>
      <article class="card"><div class="card-heading"><h2>Your next tasks</h2><button id="home-add" class="button">Add a to-do</button></div><div id="next-tasks" class="task-list"></div></article>
    </section>

    <section id="tasks-view" class="view hidden">
      <article class="card"><div class="card-heading"><div><h2>To-dos</h2><p>Keep the important things moving.</p></div><button id="add-task" class="button">Add a to-do</button></div><div class="filters"><select id="filter-category"><option value="">All categories</option></select><select id="sort-tasks"><option value="priority">Sort by priority</option><option value="due">Sort by due date</option><option value="title">Sort by title</option></select></div><div class="category-create"><input id="new-category" placeholder="New category"><button id="add-category" class="button secondary">Add category</button></div><div id="task-message" class="message"></div><div id="all-tasks" class="task-list"></div></article>
    </section>
  </main>

  <dialog id="task-dialog"><form method="dialog" id="task-form"><div class="card-heading"><h2 id="dialog-title">Add a to-do</h2><button value="cancel" class="close-button">×</button></div><input type="hidden" id="task-id"><label>Title<input id="task-title" required maxlength="200" placeholder="What needs doing?"></label><label>Priority <output id="priority-output">3</output><input id="task-priority" type="range" min="1" max="5" value="3"></label><label>Category <select id="task-category"><option value="">No category</option></select></label><label>Due date<input id="task-due" type="date" required></label><div id="form-message" class="message"></div><div class="dialog-actions"><button value="cancel" class="button secondary">Cancel</button><button id="save-task" value="default" class="button">Save</button></div></form></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
